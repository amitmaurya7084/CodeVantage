# Render Blueprint — deploys the React frontend (static site) and the Express API.
# Secrets are NOT stored here: every `sync: false` value is asked for in the Render dashboard.
services:
  # ---------- Frontend (React + Vite) ----------
  - type: web
    name: codevantage-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback: without this, opening or refreshing /login, /student/dashboard or a
    # QR link like /verify/CV-WD-2026-000001 returns Render's own "Not Found" page,
    # because those paths only exist inside the React app, not as files.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend URL — set AFTER the API service exists, e.g. https://codevantage-api.onrender.com
      # (the "/api" suffix is added automatically). Must be set before the build runs.
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false

  # ---------- Backend (Express + MongoDB) ----------
  - type: web
    name: codevantage-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Frontend and API are on different *.onrender.com sites, so the login cookie
      # must be SameSite=None (it is automatically Secure in production).
      - key: COOKIE_SAMESITE
        value: none
      # Exact frontend URL(s), no path. Comma-separate to allow several.
      - key: CLIENT_URL
        sync: false
      # Frontend URL again — used inside certificate QR codes (NOT the API URL).
      - key: PUBLIC_SITE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CERTIFICATE_FEE_INR
        value: "149"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: CodeVantage
